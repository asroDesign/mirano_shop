<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#703c4b" />
    <title>اتصال اینترنت برقرار نیست | مه لقا</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fffaf8; color: #302329; font-family: Vazirmatn, Tahoma, sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border: 1px solid #f1e5e6; border-radius: 28px; background: #fff; text-align: center; box-shadow: 0 24px 70px #703c4b14; }
      .mark { display: grid; width: 72px; height: 72px; margin: 0 auto 20px; place-items: center; border-radius: 24px; background: #703c4b; color: #fff7f1; font-size: 34px; }
      h1 { margin: 0; font-size: 21px; }
      p { margin: 12px 0 24px; color: #74676b; font-size: 14px; line-height: 2; }
      a { display: inline-block; border-radius: 14px; padding: 12px 24px; background: #703c4b; color: white; text-decoration: none; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">م</div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای دیدن قیمت‌ها، موجودی و ادامهٔ خرید به اینترنت وصل شوید و دوباره تلاش کنید.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
